# Optional deployment blueprint. Not provisioned during local development.
# Confirm hosting costs before applying: durable uploads require a persistent disk.
services:
  - type: web
    name: propcare
    runtime: docker
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    disk:
      name: propcare-photos
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: ConnectionStrings__PropCare
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: SeedDemo
        value: "true"
      - key: DemoPassword
        sync: false
      - key: Storage__Path
        value: /app/storage
