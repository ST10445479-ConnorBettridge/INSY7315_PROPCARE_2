# Free app hosting; PostgreSQL and private photos are supplied by a free Supabase project.
# Configure secrets in Render. Never store credentials in this file.
services:
  - type: web
    name: propcare
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    # GitHub's deploy workflow sends the tested commit through the secret deploy hook.
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: ConnectionStrings__PropCare
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: SeedDemo
        value: "true"
      - key: DemoPassword
        sync: false
      - key: Storage__SupabaseUrl
        sync: false
      - key: Storage__ServiceKey
        sync: false
      - key: Storage__Bucket
        value: propcare-photos
