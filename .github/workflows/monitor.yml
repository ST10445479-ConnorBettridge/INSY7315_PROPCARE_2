name: Check live application availability
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check database frontend and API availability without creating records
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          node scripts/hosted-smoke.mjs --read-only
      - name: Record failure and recovery instructions
        if: failure()
        run: |
          echo "### PropCare availability check failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check Render runtime logs, database availability and the latest release. Re-run after recovery. Enable GitHub Actions email notifications for this workflow." >> "$GITHUB_STEP_SUMMARY"
