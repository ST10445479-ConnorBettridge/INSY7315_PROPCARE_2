name: Verify hosted release
on:
  workflow_run:
    workflows: [PropCare CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && vars.APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Verify the tested commit is serving
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in {1..60}; do
            if curl -fsS --max-time 15 "$APP_URL/api/health" -o /tmp/health.json && \
               jq -e --arg sha "$EXPECTED_SHA" '.status == "success" and .database == "PostgreSQL" and .version == $sha' /tmp/health.json; then
              echo "Verified the tested release with PostgreSQL connectivity."
              exit 0
            fi
            sleep 15
          done
          echo "The tested release did not become healthy in time."
          exit 1
