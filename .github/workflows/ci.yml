name: PropCare CI
on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: propcare_test
          POSTGRES_USER: propcare
          POSTGRES_PASSWORD: integration-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U propcare -d propcare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_CONNECTION: Host=127.0.0.1;Port=5432;Database=propcare_test;Username=propcare;Password=integration-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm audit --audit-level=high && npm audit --prefix frontend --audit-level=high
      - run: npm run build
      - run: dotnet tool restore && dotnet ef migrations has-pending-model-changes --project backend/PropCare.Api --configuration Release --no-build
      - run: npm test
      - name: Verify private object storage and failure recovery
        run: npm test
        env:
          TEST_REMOTE_STORAGE: "true"
      - name: Start the browser test instance
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__PropCare: ${{ env.TEST_DATABASE_CONNECTION }}
          Jwt__Key: ci-only-signing-key-at-least-32-bytes-long
          SeedDemo: "true"
          DemoPassword: PropCare123!
        run: |
          cd backend/PropCare.Api
          dotnet bin/Release/net10.0/PropCare.Api.dll --urls http://127.0.0.1:5124 > ../../browser-api.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5124/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:browser
      - run: npm run test:browser:edge-cases
      - run: npm run test:accessibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-test-evidence
          path: |
            test-results/
            .local-api-test.log
            browser-api.log
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production container and persistent storage
        run: node scripts/container-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-test-evidence
          path: test-results/container/
